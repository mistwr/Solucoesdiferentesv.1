<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peça uma proposta | Soluções Diferentes</title><style>body{font-family:system-ui;background:#f5f7fa;color:#0b1e3d;margin:0}main{max-width:640px;margin:35px auto;padding:28px;background:#fff;border-radius:18px}label{display:block;margin-top:15px;font-weight:600}input,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font:inherit}button{background:#e8401c;color:#fff;font-weight:700;border:0;margin-top:20px;cursor:pointer}.consent{display:flex;gap:12px;align-items:start}.consent input{width:auto}small{color:#64748b}.hide{position:absolute;left:-9999px}</style></head><body><main><a href="/">← Voltar ao site</a><h1>Descubra se pode poupar</h1><p>Peça uma análise gratuita e sem compromisso de telecomunicações ou energia.</p><form id="lead-form" method="POST" action="/obrigado.html"><input type="hidden" name="origem" value="solucoesdiferentes.pt"><p class="hide"><label>Não preencher <input name="bot-field"></label></p><label>Serviço<select name="servico" required><option value="">Escolha</option><option>Telecomunicações</option><option>Eletricidade</option><option>Gás</option><option>Telecomunicações e energia</option></select></label><label>Operador atual<input name="operador" maxlength="80"></label><label>Mensalidade (€)<input type="number" name="mensalidade" min="0" max="10000" step=".01"></label><label>Nome<input name="nome" required maxlength="120" autocomplete="name"></label><label>Telemóvel<input name="telemovel" type="tel" required pattern="[+]?[0-9 ]{9,16}" maxlength="17" autocomplete="tel"></label><label>Código postal<input name="codigo_postal" required pattern="[0-9]{4}-[0-9]{3}" placeholder="0000-000" autocomplete="postal-code"></label><label class="consent"><input type="checkbox" name="consentimento_contacto" value="sim" required><span>Autorizo o contacto da Soluções Diferentes para resposta a este pedido. <small>Os dados serão usados para analisar o pedido e entrar em contacto.</small></span></label><button type="submit">Quero receber uma proposta</button><p><small>Sem compromisso. Não envie documentos sensíveis.</small></p><p id="form-error" role="alert" style="color:#b91c1c"></p></form></main><script>
const form=document.getElementById('lead-form');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const button=form.querySelector('button[type="submit"]'), error=document.getElementById('form-error');
 error.textContent='';button.disabled=true;button.textContent='A enviar...';
 try {
  const data=Object.fromEntries(new FormData(form).entries());
  const response=await fetch('/api/solucoes-diferentes/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!response.ok) throw new Error('Não foi possível enviar o pedido.');
  window.location.assign('/obrigado.html');
 } catch(e){error.textContent='Não foi possível enviar o pedido. Tente novamente mais tarde.';button.disabled=false;button.textContent='Quero receber uma proposta'}
});
</script></body></html>
